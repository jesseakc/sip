services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sip-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: sip
      POSTGRES_PASSWORD: sip
      POSTGRES_DB: sip
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sip -d sip"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sip-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-08Z
    container_name: sip-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Ollama (optional — only needed for local LLM mode) ─────────────────
  # Remove or comment out this service if using a hosted LLM provider
  # or if running with AI disabled.
  ollama:
    image: ollama/ollama:latest
    container_name: sip-ollama
    restart: unless-stopped
    command: |
      sh -c "ollama serve & sleep 5 && ollama pull llama3.1:8b && wait"
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    # Profiles let you selectively enable/disable this service:
    #   docker compose --profile ollama up
    #   docker compose up  (skips ollama)
    profiles:
      - ollama

  sip-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: sip-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Environment
      SIP_ENV: ${SIP_ENV:-local}

      # Database
      SIP_DATABASE_URL: postgres://sip:sip@postgres:5432/sip

      # Redis
      SIP_REDIS_URL: redis://redis:6379

      # Object Storage
      SIP_OBJECT_STORAGE_ENDPOINT: http://minio:9000
      SIP_OBJECT_STORAGE_ACCESS_KEY: minioadmin
      SIP_OBJECT_STORAGE_SECRET_KEY: minioadmin
      SIP_OBJECT_STORAGE_BUCKET: sip-documents

      # Auth
      SIP_AUTH_JWT_SECRET: ${JWT_SECRET:-change-me-in-production}

      # Server
      SIP_SERVER_PORT: 8000

      # AI — default to Ollama for demo mode
      # Set SIP_AI_ENABLED=false to disable AI entirely
      # Set SIP_AI_PROVIDER=openai and SIP_AI_OPENAI_API_KEY=... for hosted mode
      SIP_AI_ENABLED: ${SIP_AI_ENABLED:-false}
      SIP_AI_PROVIDER: ${SIP_AI_PROVIDER:-disabled}
      SIP_AI_OLLAMA_URL: http://ollama:11434
      SIP_AI_OLLAMA_MODEL: ${SIP_OLLAMA_MODEL:-llama3.1:8b}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  db-migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    command: sh -c "sqlx migrate run --database-url postgres://sip:sip@postgres:5432/sip"
    depends_on:
      postgres:
        condition: service_healthy

  sip-frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: sip-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    depends_on:
      sip-api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data:
  ollama_data:
