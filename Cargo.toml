[workspace]
members = [
    "crates/sip-api",
    "crates/sip-domain",
    "crates/sip-application",
    "crates/sip-infrastructure",
    "crates/sip-auth",
    "crates/sip-tenancy",
    "crates/sip-assets",
    "crates/sip-work-orders",
    "crates/sip-documents",
    "crates/sip-activity",
    "crates/sip-outbox",
    "crates/sip-ai",
    "crates/sip-plugins",
    "crates/sip-scheduler",
    "crates/sip-parts",
    "crates/sip-search",
    "crates/sip-observability",
    "crates/sip-config",
    "crates/sip-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["SIP Contributors"]
license = "AGPL-3.0"
repository = "https://github.com/sip-platform/sip"
rust-version = "1.80"

[workspace.dependencies]
# Async runtime
axum = "0.8"
tokio = { version = "1.43", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json"] }

# Identity / Time
uuid = { version = "1.16", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Auth
jsonwebtoken = "9.3"
argon2 = "0.5"

# Async traits
async-trait = "0.1"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Config
figment = { version = "0.10", features = ["env", "toml"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio-stream = { version = "0.1", features = ["sync"] }

# Decimal
rust_decimal = { version = "1.36", features = ["serde"] }

# Internal workspace crates (shared version)
sip-api = { path = "crates/sip-api" }
sip-domain = { path = "crates/sip-domain" }
sip-application = { path = "crates/sip-application" }
sip-infrastructure = { path = "crates/sip-infrastructure" }
sip-auth = { path = "crates/sip-auth" }
sip-tenancy = { path = "crates/sip-tenancy" }
sip-assets = { path = "crates/sip-assets" }
sip-work-orders = { path = "crates/sip-work-orders" }
sip-documents = { path = "crates/sip-documents" }
sip-activity = { path = "crates/sip-activity" }
sip-outbox = { path = "crates/sip-outbox" }
sip-ai = { path = "crates/sip-ai" }
sip-plugins = { path = "crates/sip-plugins" }
sip-scheduler = { path = "crates/sip-scheduler" }
sip-parts = { path = "crates/sip-parts" }
sip-search = { path = "crates/sip-search" }
sip-observability = { path = "crates/sip-observability" }
sip-config = { path = "crates/sip-config" }
sip-cli = { path = "crates/sip-cli" }
