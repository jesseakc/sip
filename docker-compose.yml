services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sip-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: sip
      POSTGRES_PASSWORD: sip
      POSTGRES_DB: sip
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sip -d sip"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sip-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-08Z
    container_name: sip-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: sip-ollama
    restart: unless-stopped
    command: |
      sh -c "ollama serve & sleep 5 && ollama pull llama3.1:8b && wait"
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  sip-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: sip-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      SIP_DATABASE_URL: postgres://sip:sip@postgres:5432/sip
      SIP_REDIS_URL: redis://redis:6379
      SIP_MINIO_ENDPOINT: http://minio:9000
      SIP_MINIO_ACCESS_KEY: minioadmin
      SIP_MINIO_SECRET_KEY: minioadmin
      SIP_MINIO_BUCKET: sip-documents
      SIP_OLLAMA_URL: http://ollama:11434
      SIP_JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      SIP_SERVER_PORT: 8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      ollama:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  db-migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    command: sh -c "sqlx migrate run --database-url $$SIP_DATABASE_URL"
    environment:
      DATABASE_URL: ${SIP_DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy

  sip-frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: sip-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    depends_on:
      sip-api:
        condition: service_healthy
volumes:
  postgres_data:
  redis_data:
  minio_data:
  ollama_data:
